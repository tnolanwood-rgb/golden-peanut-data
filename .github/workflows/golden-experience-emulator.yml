name: Golden Experience — Isolated Android WebView Emulator QA

on:
  pull_request:
    paths:
      - 'android/**'
      - 'app/**'
      - 'scripts/verify_android_webview_emulator.cjs'
      - '.github/workflows/golden-experience-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-experience-emulator-ci
  cancel-in-progress: true

jobs:
  isolated-android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install existing locked browser dependency
        run: npm ci --ignore-scripts
      - name: Enable KVM on test runner
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and test standalone preview on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          # Use the AOSP image for deterministic WebView touch QA: the Google
          # NexusLauncher has produced native ANR overlays in CI, stealing input.
          # Android 35 API/device/gesture assertions remain unchanged.
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android && bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest && cd ..
            node scripts/verify_android_webview_emulator.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-android-webview-evidence
          path: artifacts/audit/golden-experience/android-emulator/**
          retention-days: 14
