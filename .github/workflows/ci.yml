name: Golden Peanut regression checks
# Test pull requests and manual checks, not every development push.
# GitHub Actions email notifications are controlled in each user's settings.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: golden-peanut-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  assembled-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: pip install PyYAML==6.0.3
      - name: Ensure a browser is available
        run: |
          if ! test -x /usr/bin/chromium; then
            npx playwright-core install --with-deps chromium
          fi
      - name: Reproducible audit baseline
        run: python scripts/audit_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-screenshots
          path: |
            artifacts/browser-*.png
            artifacts/audit/baseline.json
            artifacts/audit/*.log
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
