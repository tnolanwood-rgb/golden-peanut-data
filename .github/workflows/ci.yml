name: Golden Peanut regression checks
# Regression checks are manual-only to prevent unsolicited
# failed-workflow notifications during active app development.
# Production deploy still runs its own tests before any release.
on:
  workflow_dispatch:
concurrency:
  group: golden-peanut-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  assembled-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: pip install PyYAML==6.0.3
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-screenshots
          path: artifacts/browser-*.png
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
