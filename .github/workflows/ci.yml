name: Golden Peanut regression checks
# Test pull requests and manual checks, not every development push.
# GitHub Actions email notifications are controlled in each user's settings.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: golden-peanut-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  assembled-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Paired GE cold-start probe needs the exact recorded base commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: pip install PyYAML==6.0.3
      - name: Ensure a browser is available
        run: |
          if ! test -x /usr/bin/chromium; then
            npx playwright-core install --with-deps chromium
          fi
      - name: Capture current main Git commit, not the possibly stale PR base
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/golden-experience'
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "${#current_main}" -eq 40
          git fetch --no-tags origin "$current_main"
          git cat-file -e "$current_main^{commit}"
          echo "GE_OBSERVED_MAIN=$current_main" >> "$GITHUB_ENV"
          echo "Read-only main identity captured for candidate and rollback rehearsal."
      - name: Lock and verify checked-out Golden Experience candidate (offline only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/golden-experience'
        shell: bash
        env:
          GP_BASE_MAIN_SHA: ${{ env.GE_OBSERVED_MAIN }}
        run: |
          set -euo pipefail
          test -n "$GP_BASE_MAIN_SHA"
          candidate_commit="$(git rev-parse --verify HEAD)"
          candidate_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          # This is the CI checkout (possibly GitHub's synthetic PR merge),
          # not an assertion about the running production application.
          manifest=artifacts/audit/golden-experience/ci-candidate-lock.json
          python3 scripts/golden_experience_candidate.py prepare \
            --commit "$candidate_commit" --tree "$candidate_tree" \
            --baseline-main "$GP_BASE_MAIN_SHA" --manifest "$manifest"
          python3 scripts/golden_experience_candidate.py verify \
            --commit "$candidate_commit" --tree "$candidate_tree" \
            --observed-main "$GP_BASE_MAIN_SHA" --manifest "$manifest"
      - name: Rehearse frontend deploy and exact-byte rollback OFFLINE only
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/golden-experience'
        shell: bash
        env:
          GP_BASE_MAIN_SHA: ${{ env.GE_OBSERVED_MAIN }}
        run: |
          set -euo pipefail
          python3 scripts/golden_experience_rollback_rehearsal.py \
            --candidate "$(git rev-parse HEAD)" \
            --rollback "$GP_BASE_MAIN_SHA" \
            --output artifacts/audit/golden-experience/offline-rollback.json
      - name: Preview Golden Experience visual acceptance before full regressions
        run: node tests/golden-experience.browser.cjs
      - name: Reproducible audit baseline
        run: python scripts/audit_baseline.py
      - name: Synthetic startup and chart payload benchmark
        run: |
          mkdir -p artifacts/audit
          node scripts/benchmark_startup.cjs > artifacts/audit/startup-benchmark.json
      - name: Investigate synthetic OSRS cold-start tail against pinned baseline
        run: GE_COLD_RUNS=6 node scripts/profile_golden_experience_cold.cjs
      - name: Synthetic repeated-session retention probe
        run: node scripts/benchmark_golden_experience_session.cjs
      - name: Reproduce intermittent retained-session DOM growth
        shell: bash
        run: |
          set -euo pipefail
          for trial in 1 2 3; do
            GE_SESSION_OUTPUT="artifacts/audit/golden-experience/session-repeat-${trial}.json" \
              node scripts/benchmark_golden_experience_session.cjs
          done
      - name: Fail if main drifted during Golden Experience verification
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/golden-experience'
        shell: bash
        run: |
          set -euo pipefail
          observed_now="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "${#observed_now}" -eq 40
          test "$observed_now" = "$GE_OBSERVED_MAIN" || {
            echo "::error::main advanced while this release candidate was being verified; redo the source and rollback lock"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-screenshots
          path: |
            artifacts/browser-*.png
            artifacts/audit/*.json
            artifacts/audit/*.log
            artifacts/audit/swipe/**
            artifacts/audit/golden-experience/osrs-cold-profile.json
            artifacts/audit/golden-experience/**
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
