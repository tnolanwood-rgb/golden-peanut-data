name: Golden Peanut — Inspect Cloudflare and Deploy Preview

on:
  push:
    branches:
      - feature/golden-experience
    paths:
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Inspect projects first; preview requires an exact existing project name'
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - preview
      project_name:
        description: 'Exact existing Cloudflare Pages project name (preview mode only)'
        required: false
        type: string
        default: 'golden-experience-staging'

permissions:
  contents: read

concurrency:
  group: gp-pages-manual-preview
  cancel-in-progress: false

jobs:
  inspect-or-preview:
    name: Inspect Cloudflare / validated preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      GP_PROJECT_NAME: ${{ inputs.project_name || 'golden-experience-staging' }}
      GP_OPERATION: ${{ inputs.operation || 'inspect' }}
      GP_PREVIEW_BRANCH: golden-experience-staging
    steps:
      - name: Verify credentials and inspect existing Pages projects
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          choice = os.environ.get('GP_OPERATION', 'inspect')
          project = os.environ.get('GP_PROJECT_NAME', '').strip()
          preview = os.environ['GP_PREVIEW_BRANCH']
          if not token or not re.fullmatch(r'[0-9a-fA-F]{32}', account):
              sys.exit('Missing CLOUDFLARE_API_TOKEN secret or valid CF_ACCOUNT_ID variable')
          if choice not in ('inspect', 'preview'):
              sys.exit('Unsupported operation')
          req = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = json.load(response)
          except urllib.error.HTTPError as error:
              # Report only public error codes; never print token, headers or raw response.
              code_list = []
              try:
                  err_body = json.loads(error.read(4096).decode('utf-8'))
                  code_list = [str(int(e['code'])) for e in (err_body.get('errors') or [])
                               if isinstance(e, dict) and isinstance(e.get('code'), int)]
              except Exception:
                  pass
              safe_codes = ','.join(code_list[:3]) or 'not supplied'
              sys.exit(f'Cloudflare Pages lookup: HTTP {error.code}, Cloudflare error code(s): {safe_codes}. Verify Pages Read/Edit permission and token account scope.')
          except Exception as error:
              sys.exit(f'Cloudflare Pages project lookup failed: {type(error).__name__}')
          if not body.get('success') or not isinstance(body.get('result'), list):
              sys.exit('Cloudflare returned an unsuccessful Pages projects response')
          projects = body['result']
          if choice == 'inspect':
              print('Existing Cloudflare Pages projects (names only; no secrets):')
              for row in projects:
                  # Report only non-secret isolation metadata.
                  source = row.get('source')
                  config = (source or {}).get('config') or {}
                  bindings = {}
                  for mode, deployment in (row.get('deployment_configs') or {}).items():
                      bindings[mode] = {key: bool(deployment.get(key)) for key in
                          ('d1_databases', 'kv_namespaces', 'r2_buckets', 'services', 'durable_object_namespaces', 'env_vars')}
                  print(json.dumps({'project': row.get('name'),
                      'subdomain': row.get('subdomain'),
                      'domains': row.get('domains'),
                      'production_branch': row.get('production_branch'),
                      'source_type': (source or {}).get('type'),
                      'git_triggers': {key: config.get(key) for key in
                          ('production_branch', 'production_deployments_enabled', 'preview_deployment_setting', 'preview_branch_includes', 'preview_branch_excludes')},
                      'binding_presence': bindings}, sort_keys=True))
              print('No deployment attempted. Confirm the matching project before running preview.')
              sys.exit(0)
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{0,62}', project):
              sys.exit('For preview, enter the exact existing Pages project name')
          match = next((row for row in projects if row.get('name') == project), None)
          if not match:
              sys.exit('Requested project name was not found among the existing Pages projects')
          # Fail closed: this workflow may deploy only to one separately named,
          # independently hosted, unbound Pages project. Never reuse production.
          if project != 'golden-experience-staging' or project == 'thegoldenpeanut':
              sys.exit('Unsafe project name: only golden-experience-staging is permitted')
          if match.get('subdomain') != 'golden-experience-staging.pages.dev':
              sys.exit('Unsafe or unverified staging pages.dev subdomain')
          if match.get('production_branch') != 'golden-experience-staging':
              sys.exit('Staging production branch must be golden-experience-staging')
          if match.get('domains') != []:
              sys.exit('Staging custom-domain inventory must be explicitly empty')
          if match.get('source') is not None:
              sys.exit('Git-connected Pages projects are not permitted for isolated staging')
          configs = match.get('deployment_configs')
          required_bindings = ('d1_databases', 'kv_namespaces', 'r2_buckets',
                               'services', 'durable_object_namespaces', 'env_vars')
          all_binding_names = set(required_bindings) | {
              'queues', 'hyperdrive', 'vectorize', 'analytics_engine_datasets',
              'ai', 'browser', 'dispatch_namespaces', 'unsafe', 'vars',
              'secrets', 'assets'
          }
          safe_config_names = {
              'compatibility_date', 'compatibility_flags', 'build_image_major_version',
              'fail_open', 'usage_model', 'placement', 'limits', 'observability'
          }
          if not isinstance(configs, dict) or not {'production', 'preview'}.issubset(configs):
              sys.exit('Both production and preview deployment configurations must be readable')
          for mode in ('production', 'preview'):
              deployment = configs[mode]
              if not isinstance(deployment, dict):
                  sys.exit('Staging deployment configuration is unreadable')
              for key in required_bindings:
                  if key not in deployment or deployment[key] not in (None, [], {}):
                      sys.exit('Staging has a missing or non-empty private binding: ' + mode + '.' + key)
              for key, value in deployment.items():
                  if key not in all_binding_names and key not in safe_config_names:
                      sys.exit('Staging has an unknown configuration field: ' + mode + '.' + key)
                  if key in all_binding_names and value not in (None, [], {}):
                      sys.exit('Staging has a non-empty private binding: ' + mode + '.' + key)
          if preview != 'golden-experience-staging':
              sys.exit('Unexpected staging deployment branch')
          print('Verified independent, unbound staging Pages project; preview deployment may proceed: ' + project)
          PY
      - name: Checkout reviewed Golden Peanut development source
        if: inputs.operation == 'preview'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Validate application before preview
        if: inputs.operation == 'preview'
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 scripts/check_release.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          npm ci --ignore-scripts
          npm test
          if ! test -x /usr/bin/chromium; then npx playwright-core install --with-deps chromium; fi
          npm run test:browser
          test -f app/index.html
          test -f app/opportunity-engine.js
      - name: Deploy PREVIEW only to verified existing Pages project
        if: inputs.operation == 'preview'
        shell: bash
        run: |
          npx --yes wrangler@4 pages deploy app --project-name "$GP_PROJECT_NAME" --branch "$GP_PREVIEW_BRANCH"

# Manual inspect/preview; workflow-file-only push also runs inspect. Production deployment is deliberately unavailable.
