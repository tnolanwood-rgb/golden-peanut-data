name: Golden Hub — Build Separate Android Preview
on:
  pull_request:
    # Website-only releases update the existing WebView origin without an APK.
    paths: ['android/**']
  push:
    branches: [feat/private-dual-game-hub-20261115]
    paths: ['android/**', '.github/workflows/private-hub-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: golden-hub-android-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  debug-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu images already provide ANDROID_HOME and SDK command-line tools.
      # setup-android@v3 tries to install the removed legacy `tools` package on Ubuntu 26.
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable, independently identified preview APK
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify APK manifest and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "com.goldenhub.dual.preview"
          sha256sum "$APK" > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Prove APK embeds the exact reviewed frontend
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          CHECKS=android/app/build/outputs/apk/debug/BUNDLED-ASSETS.txt
          printf 'GitHub checked-out source: %s\n' "$GITHUB_SHA" > "$CHECKS"
          count=0
          while IFS= read -r -d '' path; do
            rel="${path#app/}"
            if [[ "$rel" == "_headers" ]]; then continue; fi
            if ! unzip -p "$APK" "assets/hub/$rel" | cmp - "$path"; then
              echo "::error::APK asset differs from source: $rel"
              exit 1
            fi
            sha256sum "$path" >> "$CHECKS"
            count=$((count + 1))
          done < <(find app -type f -print0 | sort -z)
          test "$count" -ge 30
          echo "Verified $count Android APK assets byte-for-byte against checked-out app/"
      - uses: actions/upload-artifact@v4
        with:
          name: golden-hub-cloudflare-preview-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/BUNDLED-ASSETS.txt
            android/app/build/reports/
          retention-days: 30
