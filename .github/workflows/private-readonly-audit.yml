name: Golden Peanut — Live Private D1 Health (Read Only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-private-readonly-audit.txt'
permissions:
  contents: read
concurrency:
  group: golden-peanut-live-readonly-audit
  cancel-in-progress: false
jobs:
  verify:
    name: Verify anonymised monitor coverage without modifying records
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only D1 checks (no row dumps, no secret logs)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python scripts/audit_live_private_readonly.py
