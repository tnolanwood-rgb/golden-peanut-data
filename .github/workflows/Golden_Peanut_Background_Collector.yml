name: Golden Peanut Background Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "35 4,16 * * *"

permissions:
  contents: read

concurrency:
  group: golden-peanut-cloud-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect public GW2 prices into Cloudflare D1
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
        run: |
          python3 - <<'PYCOLLECTOR'
          """The Golden Peanut collector for GitHub Actions.
          Fetches public GW2 Trading Post prices; writes to existing Cloudflare D1 schema.
          """
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          GW2_URL = 'https://api.guildwars2.com/v2/commerce/prices'
          WATCH = sorted(set([
              49424,86269,19912,23202,23200,100992,43562,43564,99106,19913,46712,
              43849,43845,43846,43783,103738,46708,49522,23183,24562,9461,
              48807,75826,82791,11103,11928,44950,44956,13197,97398,97580,
              67639,73843,96084,24691,83926,99068,14577,11230,24800,67638,
              19793,19722,19719,49782,44941,19703,24291,19709,
              41578,79344,79346,82205,73806,83214,74825,45896,23240,98199,
              50018,72010,13452,38289,19795,19796,19797,19798,
          ]))
          ROTATE = 180
          API_TIMEOUT = 40


          def fetch_json(url, headers=None, payload=None):
              req = urllib.request.Request(
                  url, data=(json.dumps(payload).encode('utf-8') if payload is not None else None),
                  headers={'Accept':'application/json', 'User-Agent':'GoldenPeanutCollector/1.0', **(headers or {})},
                  method=('POST' if payload is not None else 'GET'))
              try:
                  with urllib.request.urlopen(req, timeout=API_TIMEOUT) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as error:
                  # Never log request headers, Cloudflare tokens, or other secrets.
                  raise RuntimeError(f'HTTP {error.code} from {urllib.parse.urlsplit(url).hostname}') from None


          def cloudflare_query(sql, params=None):
              account = os.environ['CF_ACCOUNT_ID'].strip()
              database = os.environ['CF_DATABASE_ID'].strip()
              token = os.environ['CF_API_TOKEN'].strip()
              if not (account and database and token):
                  raise RuntimeError('Missing CF_ACCOUNT_ID, CF_DATABASE_ID or CF_API_TOKEN')
              url = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
              body = {'sql':sql}
              if params is not None:
                  body['params'] = [str(p) for p in params]
              response = fetch_json(url, {
                  'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'
              }, body)
              if not response.get('success') or response.get('errors'):
                  errs = response.get('errors', [])
                  raise RuntimeError('Cloudflare D1 query failed: ' + ', '.join(str(e.get('message', 'unknown')) for e in errs)[:250])
              results = response.get('result') or []
              if not all(part.get('success', False) for part in results):
                  raise RuntimeError('Cloudflare D1 statement failed')
              return results[0].get('results', []) if results else []


          def state(key, fallback='0'):
              rows = cloudflare_query('SELECT value FROM collector_state WHERE key=?', [key]);
              return rows[0]['value'] if rows else fallback


          def put_state(key, value):
              cloudflare_query('INSERT INTO collector_state (key, value) VALUES (?, ?) ON CONFLICT(key) DO UPDATE SET value=excluded.value', [key, str(value)])


          def init_tables():
              cloudflare_query('CREATE TABLE IF NOT EXISTS collector_state (key TEXT PRIMARY KEY, value TEXT NOT NULL)')
              cloudflare_query('CREATE TABLE IF NOT EXISTS quote_observations (observed_at INTEGER NOT NULL, item_id INTEGER NOT NULL, buy_copper INTEGER NOT NULL, sell_copper INTEGER NOT NULL, buy_quantity INTEGER NOT NULL, sell_quantity INTEGER NOT NULL, PRIMARY KEY(observed_at, item_id))')
              cloudflare_query('CREATE INDEX IF NOT EXISTS idx_quote_item_time ON quote_observations(item_id, observed_at DESC)')


          def clean_number(value):
              try:
                  v = int(value)
                  return v if 0 <= v <= 2**60 else 0
              except (ValueError, TypeError, OverflowError):
                  return 0


          def collect():
              init_tables()
              # The official no-IDs response is the public item-ID catalogue, not trade volume.
              all_ids = fetch_json(GW2_URL)
              if not isinstance(all_ids, list) or len(all_ids) < 1000:
                  raise RuntimeError('ArenaNet market catalogue unexpectedly incomplete')
              all_ids = [i for i in all_ids if isinstance(i, int) and i > 0]
              cursor = clean_number(state('github_cursor', '0'))
              if cursor >= len(all_ids):
                  cursor = 0
              rotating = all_ids[cursor:cursor + ROTATE]
              next_cursor = cursor + ROTATE
              if next_cursor >= len(all_ids):
                  next_cursor = 0
              request_ids = sorted(set(WATCH + rotating))
              observed = []
              # Keep request URLs comfortably short and avoid a burst of parallel calls.
              for offset in range(0, len(request_ids), 110):
                  group = request_ids[offset:offset+110]
                  url = GW2_URL + '?ids=' + ','.join(map(str,group))
                  result = fetch_json(url)
                  if not isinstance(result, list):
                      raise RuntimeError('Invalid market price batch from ArenaNet')
                  observed.extend(result)
                  time.sleep(0.4)
              if not observed:
                  raise RuntimeError('No public market prices returned')
              timestamp = int(time.time()) // 900 * 900
              # Validate everything as integers before interpolating numeric SQL literals.
              values = []
              for row in observed:
                  item_id = row.get('id') if isinstance(row, dict) else None
                  if not isinstance(item_id, int) or item_id <= 0:
                      continue
                  buys = row.get('buys') or {}
                  sells = row.get('sells') or {}
                  values.append((timestamp, item_id,
                                 clean_number(buys.get('unit_price')), clean_number(sells.get('unit_price')),
                                 clean_number(buys.get('quantity')),clean_number(sells.get('quantity'))))
              if not values:
                  raise RuntimeError('No valid prices to store')
              for start in range(0, len(values), 100):
                  batch = values[start:start+100]
                  sql = 'INSERT OR IGNORE INTO quote_observations (observed_at,item_id,buy_copper,sell_copper,buy_quantity,sell_quantity) VALUES ' + ','.join('(' + ','.join(map(str, row)) + ')' for row in batch)
                  cloudflare_query(sql)
              # Write cursor only AFTER all quote rows were stored; reruns are idempotent.
              put_state('github_cursor', next_cursor)
              put_state('last_run', timestamp)
              put_state('last_received', len(values))
              put_state('last_result', 'success')
              put_state('last_attempt', int(time.time()))
              # A small rolling window avoids indefinite D1 growth.
              if datetime.datetime.now(datetime.timezone.utc).hour == 2:
                  cloudflare_query('DELETE FROM quote_observations WHERE observed_at < ?', [timestamp-30*86400])
              print(json.dumps({
                  'status':'SUCCESS', 'received':len(values), 'watch_count':len(WATCH),
                  'catalogue':len(all_ids), 'next_cursor':next_cursor,
                  'saved_at_utc':datetime.datetime.fromtimestamp(timestamp,datetime.timezone.utc).isoformat(),
                  'note':'Order book snapshots are not confirmed trading volume'
              }))


          if __name__ == '__main__':
              collect()
          PYCOLLECTOR

      - name: Stage 5.0 shadow research — order-book depth and forecast audit
        if: success()
        continue-on-error: true
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
        run: |
          python3 - <<'PYGP5SHADOW'
          """Golden Peanut Stage 5.0: isolated PUBLIC market depth / forecast shadow research.

          No personal API key, account data, orders, or existing schema is modified.
          This collector must run as a continue-on-error step AFTER the original price collector.
          Predictions concern future best ASK quotes only; they are NOT fill predictions.
          """
          import datetime as dt
          import json
          import os
          import statistics
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          LISTINGS_API = 'https://api.guildwars2.com/v2/commerce/listings'
          PRIORITY_IDS = (49424, 86269, 43564, 100992, 19912, 23202,
                          99106, 46712, 9461, 19722, 19719, 48807)
          MAX_LEVELS = 5
          HORIZON = 6 * 3600
          EVALUATION_GRACE = 90 * 60
          PREDICTION_HISTORY_HOURS = 24
          MAX_ASK = 2**31 - 1


          def safe_int(v, maximum=2**60):
              if isinstance(v, bool):
                  return 0
              try:
                  n = int(v)
                  return n if 0 <= n <= maximum else 0
              except (ValueError, TypeError, OverflowError):
                  return 0


          def http_json(url, payload=None, headers=None):
              raw = json.dumps(payload).encode('utf-8') if payload is not None else None
              req = urllib.request.Request(
                  url, data=raw,
                  method='POST' if raw is not None else 'GET',
                  headers={'Accept': 'application/json', 'User-Agent': 'GoldenPeanutShadow/5.0',
                           **(headers or {})})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=35) as res:
                          return json.loads(res.read().decode('utf-8'))
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          host = urllib.parse.urlsplit(url).hostname
                          # Cloudflare's structured errors identify invalid SQL/API shapes.
                          # Never log headers, tokens, request body, or arbitrary server text.
                          details = ''
                          if host == 'api.cloudflare.com':
                              try:
                                  body = json.loads(exc.read(4096).decode('utf-8'))
                                  errors = body.get('errors') if isinstance(body, dict) else None
                                  if isinstance(errors, list):
                                      valid = [f"{int(e.get('code', 0))}: {str(e.get('message',''))[:180]}"
                                               for e in errors if isinstance(e, dict)]
                                      if valid:
                                          details = '; '.join(valid[:2])[:300]
                              except (ValueError, UnicodeDecodeError, TypeError):
                                  pass
                          raise RuntimeError(f'Upstream HTTP {exc.code} from {host}' +
                                             (': ' + details if details else '')) from None
                      time.sleep(2 ** attempt)
              raise RuntimeError('Network retries exhausted')


          def db_query(sql, params=()):
              account = os.environ['CF_ACCOUNT_ID'].strip()
              database = os.environ['CF_DATABASE_ID'].strip()
              token = os.environ['CF_API_TOKEN'].strip()
              if not all((account, database, token)):
                  raise RuntimeError('Missing Cloudflare connection environment')
              url = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
              # Match the confirmed-working original collector: omit params when empty.
              # Cloudflare's D1 REST API treats params as OPTIONAL.
              payload = {'sql': sql}
              if params:
                  payload['params'] = [str(p) for p in params]
              try:
                  resp = http_json(url, payload,
                                  {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'})
              except RuntimeError as exc:
                  # Only echo a tightly controlled operation identifier, not SQL values.
                  operation = sql.lstrip().split(None, 2)
                  label = (' '.join(operation[:2]) if len(operation) >= 2 else 'query')
                  raise RuntimeError(f'D1 shadow {label} failed: {exc}') from None
              if not isinstance(resp, dict) or not resp.get('success') or resp.get('errors'):
                  raise RuntimeError('D1 shadow query failed')
              parts = resp.get('result') or []
              if not parts or not all(isinstance(p, dict) and p.get('success') for p in parts):
                  raise RuntimeError('D1 shadow statement rejected')
              return parts[0].get('results') or []


          def initialize_schema():
              # Only NEW gp5-prefixed tables; never ALTER/DELETE existing production tables.
              db_query('''CREATE TABLE IF NOT EXISTS gp5_depth_v1 (
                  observed_at INTEGER NOT NULL, item_id INTEGER NOT NULL,
                  side TEXT NOT NULL, level_no INTEGER NOT NULL,
                  price_copper INTEGER NOT NULL, quantity INTEGER NOT NULL,
                  listing_count INTEGER NOT NULL,
                  PRIMARY KEY(item_id, observed_at, side, level_no))''')
              db_query('''CREATE TABLE IF NOT EXISTS gp5_shadow_predictions_v1 (
                  item_id INTEGER NOT NULL, created_at INTEGER NOT NULL,
                  model TEXT NOT NULL, due_at INTEGER NOT NULL,
                  start_ask_copper INTEGER NOT NULL, forecast_ask_copper INTEGER NOT NULL,
                  historical_samples INTEGER NOT NULL,
                  status TEXT NOT NULL DEFAULT 'pending',
                  evaluated_at INTEGER, actual_ask_copper INTEGER,
                  abs_error_copper INTEGER,
                  PRIMARY KEY(item_id, created_at, model, due_at))''')
              db_query('CREATE INDEX IF NOT EXISTS gp5_prediction_due_v1 ON gp5_shadow_predictions_v1(status, due_at)')
              db_query('CREATE INDEX IF NOT EXISTS gp5_depth_item_time_v1 ON gp5_depth_v1(item_id, observed_at DESC)')


          def parse_depth(payload, observed_at):
              if not isinstance(payload, list):
                  raise RuntimeError('Unexpected listings response')
              seen = set()
              depth_rows = []
              current_asks = {}
              for item in payload:
                  if not isinstance(item, dict):
                      continue
                  item_id = safe_int(item.get('id'))
                  if item_id not in PRIORITY_IDS or item_id in seen:
                      continue
                  seen.add(item_id)
                  for side in ('buys', 'sells'):
                      levels = item.get(side)
                      if not isinstance(levels, list):
                          continue
                      good = []
                      for level in levels[:MAX_LEVELS]:
                          if not isinstance(level, dict):
                              continue
                          p = safe_int(level.get('unit_price'), MAX_ASK)
                          q = safe_int(level.get('quantity'))
                          count = safe_int(level.get('listings'))
                          if p > 0 and q > 0:
                              good.append((p, q, count))
                      # API buys ordered high->low and sells low->high; verify locally.
                      prices = [p for p, _, _ in good]
                      if prices != sorted(prices, reverse=(side == 'buys')):
                          raise RuntimeError('Order book levels unexpectedly unordered')
                      for idx, (p, q, count) in enumerate(good, 1):
                          depth_rows.append((observed_at, item_id, side, idx, p, q, count))
                      if side == 'sells' and good:
                          current_asks[item_id] = good[0][0]
              if not seen:
                  raise RuntimeError('No requested markets returned by listings API')
              return depth_rows, current_asks


          def insert_rows(table, cols, rows, batch_size=40):
              if not rows:
                  return 0
              ncols = len(cols)
              # D1 permits at most 100 bound parameters per SQL statement.
              # Leave headroom and calculate the cap for each table schema.
              # Depth: 7 fields => 11 rows (77 params); forecasts: 8 => 10 (80).
              if not ncols or ncols > 80:
                  raise RuntimeError('Invalid shadow insert column count')
              batch_size = min(batch_size, max(1, 80 // ncols))
              for i in range(0, len(rows), batch_size):
                  group = rows[i:i+batch_size]
                  placeholders = ','.join(['(' + ','.join('?' for _ in range(ncols)) + ')' for _ in group])
                  sql = 'INSERT OR IGNORE INTO ' + table + ' (' + ','.join(cols) + ') VALUES ' + placeholders
                  params = tuple(v for row in group for v in row)
                  db_query(sql, params)
              return len(rows)


          def historical_asks(item_id, timestamp):
              # Historical prices only BEFORE prediction timestamp; no future leakage.
              rows = db_query('''SELECT observed_at, sell_copper
                  FROM quote_observations
                  WHERE item_id=? AND observed_at<? AND observed_at>=? AND sell_copper>0
                  ORDER BY observed_at DESC LIMIT 96''',
                  (item_id, timestamp, timestamp - PREDICTION_HISTORY_HOURS*3600))
              clean = [(safe_int(r.get('observed_at')), safe_int(r.get('sell_copper'), MAX_ASK))
                       for r in rows if isinstance(r, dict)]
              return [(t, p) for t, p in clean if p and t]


          def make_predictions(current_asks, timestamp):
              rows = []
              for item_id, ask in sorted(current_asks.items()):
                  history = historical_asks(item_id, timestamp)
                  rows.append((item_id, timestamp, 'ask_persistence_6h', timestamp+HORIZON,
                               ask, ask, len(history), 'pending'))
                  # Median baseline only after 12 separate readings across >=4h.
                  if len(history) >= 12 and history[0][0] - history[-1][0] >= 4*3600:
                      median_ask = int(statistics.median([p for _, p in history]))
                      rows.append((item_id, timestamp, 'ask_median24h_6h', timestamp+HORIZON,
                                   ask, median_ask, len(history), 'pending'))
              return rows


          def evaluate_predictions(current_asks, timestamp):
              due = db_query('''SELECT item_id, created_at, model, due_at
                  FROM gp5_shadow_predictions_v1
                  WHERE status='pending' AND due_at<=? ORDER BY due_at ASC LIMIT 240''', (timestamp,))
              evaluated = 0
              missed = 0
              for r in due:
                  item_id = safe_int(r.get('item_id'))
                  created = safe_int(r.get('created_at'))
                  due_at = safe_int(r.get('due_at'))
                  model = r.get('model')
                  if not isinstance(model, str) or model not in ('ask_persistence_6h', 'ask_median24h_6h'):
                      continue
                  if due_at <= created or due_at > timestamp:
                      continue
                  if timestamp - due_at > EVALUATION_GRACE:
                      db_query('''UPDATE gp5_shadow_predictions_v1 SET status='missed_window', evaluated_at=?
                          WHERE item_id=? AND created_at=? AND model=? AND due_at=? AND status='pending' ''',
                          (timestamp, item_id, created, model, due_at))
                      missed += 1
                  elif item_id in current_asks:
                      actual = current_asks[item_id]
                      db_query('''UPDATE gp5_shadow_predictions_v1
                          SET status='observed', evaluated_at=?, actual_ask_copper=?,
                              abs_error_copper=ABS(forecast_ask_copper - ?)
                          WHERE item_id=? AND created_at=? AND model=? AND due_at=? AND status='pending' ''',
                          (timestamp, actual, actual, item_id, created, model, due_at))
                      evaluated += 1
                  # Missing item quote: leave pending until the grace period expires.
              return evaluated, missed


          def collect():
              initialize_schema()
              timestamp = int(time.time()) // 900 * 900
              url = LISTINGS_API + '?ids=' + ','.join(map(str, PRIORITY_IDS))
              payload = http_json(url)
              levels, asks = parse_depth(payload, timestamp)
              insert_rows('gp5_depth_v1',
                          ('observed_at', 'item_id', 'side', 'level_no', 'price_copper', 'quantity', 'listing_count'), levels)
              evaluated, missed = evaluate_predictions(asks, timestamp)
              new_predictions = make_predictions(asks, timestamp)
              insert_rows('gp5_shadow_predictions_v1',
                          ('item_id', 'created_at', 'model', 'due_at', 'start_ask_copper',
                           'forecast_ask_copper', 'historical_samples', 'status'), new_predictions)
              # Prune at most once daily and only within the new shadow tables.
              if dt.datetime.fromtimestamp(timestamp, dt.timezone.utc).hour == 2:
                  db_query('DELETE FROM gp5_depth_v1 WHERE observed_at<?', (timestamp - 30*86400,))
                  db_query('DELETE FROM gp5_shadow_predictions_v1 WHERE created_at<?', (timestamp - 90*86400,))
              print(json.dumps({'shadow_stage':'5.0', 'status':'SUCCESS', 'observed_at_utc':
                  dt.datetime.fromtimestamp(timestamp, dt.timezone.utc).isoformat(),
                  'markets_returned': len(set(r[1] for r in levels)), 'depth_rows_processed': len(levels),
                  'new_forecasts_attempted': len(new_predictions), 'outcomes_checked': evaluated,
                  'outcomes_missed_window': missed,
                  'note':'Forecasts predict quoted asks only, never actual trades or fill probabilities'}))


          if __name__ == '__main__':
              try:
                  collect()
              except Exception as exc:
                  # Stage 5 must not stop the original collector: workflow uses continue-on-error.
                  print('STAGE5 SHADOW FAILED (original collector unaffected): ' + str(exc), file=sys.stderr)
                  sys.exit(1)
          PYGP5SHADOW
      - name: Stage 5.1 — prediction performance monitor (read-only)
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '35 4,16 * * *') }}
        continue-on-error: false
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
        run: |
          python3 - <<'PYGP51MONITOR'
          """The Golden Peanut Stage 5.1 — read-only shadow prediction performance audit.
          
          Reads ONLY gp5_ tables. Produces a GitHub Actions summary and optional static HTML.
          No trade placement, account keys, or allocation influence.
          """
          import datetime as dt
          import html
          import json
          import math
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from pathlib import Path
          
          MODEL_NAMES = {
              'ask_persistence_6h': 'Current ask persists',
              'ask_median24h_6h': '24h historical median',
          }
          
          
          def number(v, default=0):
              try:
                  n = float(v)
                  return n if math.isfinite(n) else default
              except (TypeError, ValueError):
                  return default
          
          
          def integer(v, default=0):
              return int(number(v, default))
          
          
          def when(t):
              if not t:
                  return '—'
              return dt.datetime.fromtimestamp(integer(t), dt.timezone.utc).strftime('%d %b %Y, %H:%M UTC')
          
          
          def fmt_error(v, unit='copper'):
              if v is None:
                  return '—'
              n = number(v)
              if unit == 'percent':
                  return f'{n:.2f}%'
              return f'{n:,.1f}c'
          
          
          def read_cloudflare(sql, params=()):
              """Bounded server-to-server D1 API query. Error messages exclude SQL and token."""
              account = os.environ.get('CF_ACCOUNT_ID', '').strip()
              database = os.environ.get('CF_DATABASE_ID', '').strip()
              token = os.environ.get('CF_API_TOKEN', '').strip()
              if not account or not database or not token:
                  raise RuntimeError('Cloudflare connection not configured')
              url = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
              body = {'sql': sql}
              if params:
                  body['params'] = [str(p) for p in params]
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method='POST',
                  headers={'Accept': 'application/json', 'Content-Type': 'application/json',
                           'Authorization': 'Bearer ' + token, 'User-Agent': 'GoldenPeanutMonitor/5.1'})
              try:
                  with urllib.request.urlopen(req, timeout=35) as response:
                      result = json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f'Cloudflare D1 returned HTTP {exc.code}') from None
              if not result.get('success') or result.get('errors'):
                  raise RuntimeError('Cloudflare D1 rejected a monitor read')
              chunks = result.get('result') or []
              if not chunks or not chunks[0].get('success'):
                  raise RuntimeError('Cloudflare D1 returned an unsuccessful monitor read')
              return chunks[0].get('results') or []
          
          
          def names_for(ids):
              # Item-name lookup is optional and public. No API key or private data.
              names = {}
              if not ids:
                  return names
              url = 'https://api.guildwars2.com/v2/items?ids=' + ','.join(str(int(i)) for i in ids[:40])
              req = urllib.request.Request(url, headers={'Accept': 'application/json',
                                                         'User-Agent': 'GoldenPeanutMonitor/5.1'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      rows = json.loads(response.read())
                  if isinstance(rows, list):
                      for item in rows:
                          if isinstance(item, dict) and isinstance(item.get('name'), str):
                              names[integer(item.get('id'))] = item['name'][:90]
              except (urllib.error.URLError, OSError, ValueError, TimeoutError):
                  pass
              return names
          
          
          def data_snapshot(query):
              present = query("SELECT name FROM sqlite_master WHERE type='table' AND name IN ('gp5_depth_v1', 'gp5_shadow_predictions_v1')")
              table_names = {r.get('name') for r in present}
              if not {'gp5_depth_v1', 'gp5_shadow_predictions_v1'}.issubset(table_names):
                  return {'ready': False, 'message': 'Stage 5.0 tables not yet initialised',
                          'tables_found': sorted(table_names), 'summary': {}, 'models': [],
                          'paired': {}, 'markets': [], 'days': [], 'depth': {}}
              summary = query('''SELECT COUNT(*) AS total,
                  SUM(CASE WHEN status='pending' THEN 1 ELSE 0 END) AS pending,
                  SUM(CASE WHEN status='observed' THEN 1 ELSE 0 END) AS evaluated,
                  SUM(CASE WHEN status='missed_window' THEN 1 ELSE 0 END) AS missed,
                  COUNT(DISTINCT item_id) AS markets,
                  MIN(created_at) AS first_prediction, MAX(created_at) AS last_prediction,
                  MAX(evaluated_at) AS last_evaluation
                  FROM gp5_shadow_predictions_v1''')[0]
              depth = query('''SELECT COUNT(*) AS rows, COUNT(DISTINCT item_id) AS markets,
                  MIN(observed_at) AS first_seen, MAX(observed_at) AS last_seen
                  FROM gp5_depth_v1''')[0]
              models = query('''SELECT model, COUNT(*) AS total,
                  SUM(CASE WHEN status='pending' THEN 1 ELSE 0 END) AS pending,
                  SUM(CASE WHEN status='observed' THEN 1 ELSE 0 END) AS evaluated,
                  SUM(CASE WHEN status='missed_window' THEN 1 ELSE 0 END) AS missed,
                  AVG(CASE WHEN status='observed' THEN abs_error_copper END) AS mae_copper,
                  AVG(CASE WHEN status='observed' AND actual_ask_copper>0
                    THEN 100.0 * abs_error_copper / actual_ask_copper END) AS mape,
                  AVG(CASE WHEN status='observed' AND actual_ask_copper>0
                    THEN CASE WHEN 100.0 * abs_error_copper / actual_ask_copper <=5 THEN 100.0 ELSE 0.0 END END) AS within_5_pct,
                  COUNT(DISTINCT CASE WHEN status='observed' THEN item_id END) AS evaluated_markets
                  FROM gp5_shadow_predictions_v1 GROUP BY model ORDER BY model''')
              paired = query('''SELECT COUNT(*) AS pairs,
                  COUNT(DISTINCT p.item_id) AS markets,
                  AVG(p.abs_error_copper) AS persistence_mae,
                  AVG(m.abs_error_copper) AS median_mae,
                  SUM(CASE WHEN m.abs_error_copper < p.abs_error_copper THEN 1 ELSE 0 END) AS median_wins,
                  SUM(CASE WHEN m.abs_error_copper > p.abs_error_copper THEN 1 ELSE 0 END) AS persistence_wins,
                  SUM(CASE WHEN m.abs_error_copper = p.abs_error_copper THEN 1 ELSE 0 END) AS ties
                  FROM gp5_shadow_predictions_v1 p
                  INNER JOIN gp5_shadow_predictions_v1 m
                     ON m.item_id=p.item_id AND m.created_at=p.created_at AND m.due_at=p.due_at
                  WHERE p.model='ask_persistence_6h' AND m.model='ask_median24h_6h'
                    AND p.status='observed' AND m.status='observed' ''')[0]
              markets = query('''SELECT item_id, COUNT(*) AS predictions,
                  SUM(CASE WHEN status='observed' THEN 1 ELSE 0 END) AS observed,
                  AVG(CASE WHEN status='observed' AND actual_ask_copper>0
                      THEN 100.0 * abs_error_copper / actual_ask_copper END) AS mape,
                  MIN(created_at) AS first_prediction,
                  MAX(created_at) AS last_prediction
                  FROM gp5_shadow_predictions_v1 GROUP BY item_id
                  ORDER BY observed DESC, predictions DESC LIMIT 16''')
              days = query('''SELECT CAST(evaluated_at / 86400 AS INTEGER) AS utc_day, model,
                  COUNT(*) AS evaluated,
                  AVG(CASE WHEN actual_ask_copper>0 THEN 100.0 * abs_error_copper / actual_ask_copper END) AS mape
                  FROM gp5_shadow_predictions_v1
                  WHERE status='observed' AND evaluated_at>0
                  GROUP BY CAST(evaluated_at / 86400 AS INTEGER), model
                  ORDER BY utc_day DESC LIMIT 40''')
              return {'ready': True, 'summary': summary, 'depth': depth, 'models': models,
                      'paired': paired, 'markets': markets, 'days': days}
          
          
          def build_report(data, names=None):
              names = names or {}
              s, depth = data['summary'], data['depth']
              models, pair, markets, days = data['models'], data['paired'], data['markets'], data['days']
              evaluated = integer(s.get('evaluated'))
              pairs = integer(pair.get('pairs'))
              markets_count = integer(pair.get('markets'))
              confidence = ('Awaiting six-hour results' if not evaluated else
                            'Exploratory only — fewer than 30 paired forecasts' if pairs < 30 else
                            'Preliminary — need multiple market regimes and more samples' if pairs < 100 or markets_count < 4 else
                            'Observational benchmark only — not execution-validated')
              model_rows = []
              for m in models:
                  model_rows.append([MODEL_NAMES.get(m['model'], m['model']),
                      str(integer(m['total'])), str(integer(m['evaluated'])), str(integer(m['pending'])),
                      str(integer(m['missed'])), fmt_error(m['mae_copper']), fmt_error(m['mape'],'percent'),
                      fmt_error(m['within_5_pct'],'percent')])
              market_rows = []
              for idx,m in enumerate(markets):
                  label = names.get(integer(m['item_id'])) or ('Unnamed market '+str(idx+1))
                  market_rows.append([label, str(integer(m['predictions'])),str(integer(m['observed'])),fmt_error(m['mape'],'percent')])
              day_rows = []
              for row in days:
                  date = dt.datetime.fromtimestamp(integer(row['utc_day'])*86400,dt.timezone.utc).strftime('%d %b')
                  day_rows.append([date,MODEL_NAMES.get(row['model'],row['model']),str(integer(row['evaluated'])),fmt_error(row['mape'],'percent')])
              comparison = ('Not enough matched outcomes to compare the baselines.' if pairs < 30 else
                  ('Persistence baseline has lower paired MAE.' if number(pair.get('persistence_mae')) < number(pair.get('median_mae')) else
                   '24h median baseline has lower paired MAE.' if number(pair.get('median_mae')) < number(pair.get('persistence_mae')) else
                   'The baseline errors are tied.') + ' This is a diagnostic, not proof of tradable performance.')
              def md_table(headers, rows):
                  return '\n'.join(['| '+' | '.join(headers)+' |', '| '+' | '.join('---' for _ in headers)+' |']
                       + ['| '+' | '.join(str(v).replace('|','/') for v in r)+' |' for r in rows])
              generated_at = dt.datetime.now(dt.timezone.utc).strftime('%d %b %Y, %H:%M UTC')
              markdown = '\n'.join([
                  '## 🥜 The Golden Peanut · Quantum prediction monitor',
                  '**Read-only Stage 5.1 report** · Generated '+generated_at,
                  '',
                  f'**{integer(s.get("total"))} predictions** · {evaluated} evaluated · {integer(s.get("pending"))} pending · {integer(s.get("missed"))} missed evaluation windows',
                  f'**Order-book research:** {integer(depth.get("rows"))} price-level observations across {integer(depth.get("markets"))} markets. Latest: {when(depth.get("last_seen"))}',
                  '', '**Evidence level:** '+confidence,
                  '', '### Model accuracy (future public quoted ASK only)',
                  md_table(['Baseline','Created','Evaluated','Pending','Missed','MAE','Avg % error','Within 5%'],model_rows),
                  '', '### Fair head-to-head: identical markets and prediction times',
                  f'{pairs} matched comparisons across {markets_count} markets · Persistence MAE: {fmt_error(pair.get("persistence_mae"))} · 24h median MAE: {fmt_error(pair.get("median_mae"))} · Median wins: {integer(pair.get("median_wins"))} · Persistence wins: {integer(pair.get("persistence_wins"))} · Ties: {integer(pair.get("ties"))}',
                  '', comparison,
                  '', '### Market observations',
                  md_table(['Market','Forecasts','Evaluated','Avg % error'], market_rows),
                  '', '### Important limits',
                  '- Outcomes are **quoted asks**, not confirmed completed sales or evidence that your orders would fill.',
                  '- Missed evaluation windows stay separate and are not counted as accurate or inaccurate predictions.',
                  '- **No trading decisions or capital allocations are modified by this report.**',
                  '- If the sample is sparse, do not interpret low forecast error as a repeatable market edge.',
                  ''])
              def esc(v): return html.escape(str(v))
              def web_table(headers, rows):
                  h=''.join('<th>'+esc(c)+'</th>' for c in headers)
                  body=''.join('<tr>'+''.join('<td>'+esc(c)+'</td>' for c in row)+'</tr>' for row in rows)
                  return '<div class="table-wrap"><table><thead><tr>'+h+'</tr></thead><tbody>'+body+'</tbody></table></div>'
              html_file = '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Peanut · Quantum Monitor</title><style>
          :root{color-scheme:dark;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:#090b1b;color:#f6f2ff}*{box-sizing:border-box}body{margin:0;padding:20px 14px 50px;background:radial-gradient(ellipse at 0 0,#332354a8,transparent 55%),linear-gradient(145deg,#0b0a19,#14162e)}.wrap{max-width:1100px;margin:0 auto}h1{font-size:clamp(24px,4vw,38px);margin:6px 0;color:#f7d69b}h2{font-size:18px;margin:0 0 14px;color:#eed4ff}p{margin:7px 0}.sub{color:#c7beda;font-size:13px}.notice{padding:13px 15px;background:#22223f;border-left:3px solid #89dfe8;border-radius:6px;font-size:13px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card,.section{background:linear-gradient(150deg,#22203d,#15172f);border:1px solid #5b4b7a;border-radius:14px;padding:16px;margin:12px 0}.metric{font-size:26px;color:#f7d69b;font-weight:750;font-variant-numeric:tabular-nums}.label{font-size:12px;color:#c3bbd4}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #494066}th{color:#e8d5fa;font-size:12px}td{color:#f3eefc}.tiny{font-size:12px;color:#c6bdd7}.accent{height:3px;background:linear-gradient(90deg,#eabd76,#c982f3,#62ddec,#eb8bcb);border-radius:8px;margin:9px 0 18px}.foot{margin-top:28px;font-size:12px;color:#aaa6c0}@media(max-width:440px){.metric{font-size:22px}.card,.section{padding:12px}}</style></head><body><main class="wrap"><div class="sub">THE GOLDEN PEANUT · RESEARCH ONLY</div><h1>Quantum Intelligence Monitor</h1><div class="accent"></div><p class="sub">''' + esc(generated_at) + ''' · Public quoted asks, not executed trades.</p><div class="cards">''' + ''.join(
                 '<div class="card"><div class="label">'+esc(title)+'</div><div class="metric">'+esc(value)+'</div></div>' for title,value in [
                     ('Predictions logged',str(integer(s.get('total')))),('Evaluated',str(evaluated)),
                     ('Awaiting evaluation',str(integer(s.get('pending')))),('Missed windows',str(integer(s.get('missed')))),
                     ('Markets sampled',str(integer(depth.get('markets'))))]) + '''</div><div class="notice"><strong>Evidence level:</strong> '''+esc(confidence)+'''<p>Order-book observations: '''+str(integer(depth.get('rows')))+''' · Latest: '''+esc(when(depth.get('last_seen')))+'''</p></div><section class="section"><h2>Forecast error by baseline</h2>'''+web_table(['Baseline','Logged','Evaluated','Pending','Missed','Mean absolute error','Mean % error','Within 5%'],model_rows)+'''</section><section class="section"><h2>Fair paired comparison</h2><p>Matched observations: <strong>'''+str(pairs)+'''</strong> across <strong>'''+str(markets_count)+'''</strong> markets.</p><p>Persistence MAE: '''+esc(fmt_error(pair.get('persistence_mae')))+''' · 24h median MAE: '''+esc(fmt_error(pair.get('median_mae')))+'''</p><p class="tiny">'''+esc(comparison)+'''</p></section><section class="section"><h2>Market-by-market</h2>'''+web_table(['Market','Predictions','Evaluated','Average % error'],market_rows)+'''</section><section class="section"><h2>Recent evaluated days</h2>'''+web_table(['UTC day','Baseline','Evaluated','Avg % error'],day_rows)+'''</section><p class="foot">This report does not place or recommend orders. Historical quoted-ask accuracy does not establish achievable net trading profit or fill probability. Some public order-book changes may represent cancellations.</p></main></body></html>'''
              return markdown, html_file
          
          
          def main():
              try:
                  data = data_snapshot(read_cloudflare)
                  if not data['ready']:
                      summary = ('## 🥜 Quantum Monitor — waiting for Stage 5.0\n\n' + data['message'] +
                                 '. The original collector is independent. No changes were made.\n')
                      report = '<!doctype html><meta charset="utf-8"><title>Quantum Monitor</title><p>'+html.escape(data['message'])+'</p>'
                  else:
                      names = names_for([m['item_id'] for m in data['markets']])
                      summary,report = build_report(data,names)
                  Path('golden-peanut-quantum-report.html').write_text(report,encoding='utf-8')
                  step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
                  if step_summary:
                      with open(step_summary,'a',encoding='utf-8') as f:
                          f.write(summary+'\n')
                  print('STAGE51_MONITOR_SUCCESS '+json.dumps({
                     'ready':data['ready'], 'predictions':integer(data['summary'].get('total')),
                     'evaluated':integer(data['summary'].get('evaluated')),
                     'markets':integer(data['depth'].get('markets')),
                     'report':'golden-peanut-quantum-report.html'}))
              except Exception as e:
                  # The monitor is deliberately isolated from Stage 5.0 and the original collector.
                  print('STAGE51_MONITOR_FAILED: '+str(e)[:200])
                  raise
          
          
          if __name__=='__main__':
              main()
          PYGP51MONITOR
