name: Golden Peanut — Private Account Monitor (Approved)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/monitor-release-request.txt'

permissions:
  contents: read

concurrency:
  group: golden-peanut-account-monitor-deployment
  cancel-in-progress: false

jobs:
  deploy-monitor:
    name: Deploy isolated encrypted trading-history monitor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_D1_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare project identifiers and monitor source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CF_D1_TOKEN"
          [[ "$CF_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          [[ "$CF_DATABASE_ID" =~ ^[0-9a-fA-F-]{32,36}$ ]]
          node --check services/account-monitor/worker.js
          test -f services/account-monitor/schema.sql
      - name: Create isolated private D1 tables, never touching public collector
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          url='https://api.cloudflare.com/client/v4/accounts/{}/d1/database/{}/query'.format(
              os.environ['CF_ACCOUNT_ID'],os.environ['CF_DATABASE_ID'])
          headers={'Authorization':'Bearer '+os.environ['CF_D1_TOKEN'],
                   'Content-Type':'application/json'}
          sql=open('services/account-monitor/schema.sql',encoding='utf-8').read()
          queries=[x.strip() for x in sql.split(';') if x.strip()]
          for statement in queries:
              req=urllib.request.Request(url,method='POST',headers=headers,
                  data=json.dumps({'sql':statement}).encode())
              try:
                  with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              except urllib.error.HTTPError as exc: raise SystemExit(f'Private monitor D1 setup failed (HTTP {exc.code})')
              if not result.get('success'): raise SystemExit('Private monitor D1 initialization failed; public collector unchanged')
              if any(not x.get('success',False) for x in (result.get('result') or [])):
                  raise SystemExit('Private monitor D1 statement rejected')
          print('Private D1 account-monitor tables verified; public quote tables untouched')
          PY
      - name: Prepare isolated scheduled Worker binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CF_ACCOUNT_ID'];database_id=os.environ['CF_DATABASE_ID']
          req=urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database_id}',
              headers={'Authorization':'Bearer '+os.environ['CF_D1_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
          if not data.get('success'): raise SystemExit('Existing D1 name could not be verified')
          name=data['result']['name']
          config=f'''name = "golden-peanut-account-monitor"
          main = "services/account-monitor/worker.js"
          compatibility_date = "2026-11-06"
          workers_dev = true
          account_id = "{account}"
          [triggers]
          crons = ["*/10 * * * *"]
          [[d1_databases]]
          binding = "DB"
          database_name = {json.dumps(name)}
          database_id = "{database_id}"
          '''
          # Run fetch events in a consistent region near ArenaNet's back end.
          # This is Cloudflare's supported placement feature, not a proxy
          # or request-rate bypass. Scheduled events remain separately hosted.
          config+='\n[placement]\nregion = "aws:us-east-1"\n'
          open('.wrangler-account-monitor.toml','w',encoding='utf-8').write(config)
          print('Separate scheduled Worker configured; no public collector override')
          PY
      - name: Deploy separate Worker (never overwrite public price Worker)
        run: npx --yes wrangler@4 deploy --config .wrangler-account-monitor.toml
      - name: Initialize encryption secret only when missing
        shell: bash
        run: |
          set -euo pipefail
          set +x
          existing="$(npx --yes wrangler@4 secret list --config .wrangler-account-monitor.toml)"
          if ! printf '%s' "$existing" | grep -q 'MONITOR_ENCRYPTION_KEY'; then
            python3 -c 'import secrets;print(secrets.token_hex(32))' |
              npx --yes wrangler@4 secret put MONITOR_ENCRYPTION_KEY --config .wrangler-account-monitor.toml
            echo 'New private encryption secret stored only in Cloudflare'
          else
            echo 'Existing account encryption secret retained unchanged'
          fi
      - name: Verify scheduled Worker health
        shell: bash
        run: |
          python3 - <<'PY'
          import time,json,urllib.request,urllib.error
          url='https://golden-peanut-account-monitor.tnolanwood.workers.dev/health'
          for attempt in range(8):
              try:
                  request=urllib.request.Request(url,headers={
                      'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36',
                      'Accept':'application/json',
                      'Origin':'https://thegoldenpeanut.pages.dev'
                  })
                  with urllib.request.urlopen(request,timeout=20) as response:
                      data=json.load(response)
                      cors=response.headers.get('Access-Control-Allow-Origin')
                  if cors!='https://thegoldenpeanut.pages.dev':
                      raise ValueError('Worker did not permit the actual Golden Peanut application origin')
                  if data.get('ok') and data.get('mode')=='opt-in' and data.get('intervalMinutes')==10:
                      # Reproduce the installed app's actual authenticated POST
                      # preflight without ever sending a personal GW2 API key.
                      req=urllib.request.Request(url.replace('/health','/enroll'),method='OPTIONS',headers={
                          'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36',
                          'Origin':'https://thegoldenpeanut.pages.dev',
                          'Access-Control-Request-Method':'POST',
                          'Access-Control-Request-Headers':'authorization,cache-control,content-type,x-gp-account'
                      })
                      with urllib.request.urlopen(req,timeout=20) as preflight:
                          if preflight.status!=204: raise ValueError('Private monitor CORS preflight not HTTP 204')
                          if preflight.headers.get('Access-Control-Allow-Origin')!='https://thegoldenpeanut.pages.dev':
                              raise ValueError('Preflight did not permit app origin')
                          allowed=(preflight.headers.get('Access-Control-Allow-Headers') or '').lower().split(',')
                          for needed in ('authorization','cache-control','content-type','x-gp-account'):
                              if needed not in [x.strip() for x in allowed]:
                                  raise ValueError('Browser consent preflight would reject '+needed)
                      # Test actual bound encryption, D1 and ArenaNet egress,
                      # not just a static Worker /health response.
                      diagnose=urllib.request.Request(url.replace('/health','/diagnostics'),headers={
                          'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36',
                          'Accept':'application/json',
                          'Origin':'https://thegoldenpeanut.pages.dev'
                      })
                      with urllib.request.urlopen(diagnose,timeout=20) as checked:
                          diag=json.load(checked)
                      print('Account monitor service diagnostics:',{
                          'encryptionReady':diag.get('keyReady'),
                          'databaseReady':diag.get('dbReady'),
                          'guildWars2ApiReachable':diag.get('guildWars2ApiReachable'),
                          'gw2Status':diag.get('gw2Status')
                      },flush=True)
                      if not diag.get('keyReady') or not diag.get('dbReady'):
                          raise ValueError('Encrypted private account-monitor storage not ready')
                      if not diag.get('guildWars2ApiReachable'):
                          if diag.get('gw2Status')=='HTTP_429':
                              raise SystemExit('ArenaNet 429 from this Worker egress. Respect shared-IP quota; no further retries this run.')
                          raise SystemExit('Cloudflare Worker cannot contact public ArenaNet API: '+str(diag.get('gw2Status')))
                      # Test /enroll through all HTTP and remote GW2 request
                      # layers with a known FAKE key. No account credentials.
                      fakekey='11111111-2222-3333-4444-555555555555-aaaa-bbbb-cccc-dddddddddddd'
                      enrollment=urllib.request.Request(url.replace('/health','/enroll'),method='POST',headers={
                          'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36',
                          'Accept':'application/json',
                          'Origin':'https://thegoldenpeanut.pages.dev',
                          'Authorization':'Bearer '+fakekey,
                          'X-GP-Account':'Fixture.1234',
                          'Content-Type':'application/json'
                      },data=b'{"consent":true}')
                      try:
                          with urllib.request.urlopen(enrollment,timeout=20) as result:
                              enrollmentStatus=result.status;enrollBody=json.load(result)
                      except urllib.error.HTTPError as result:
                          enrollmentStatus=result.code;enrollBody=json.load(result)
                      stage=enrollBody.get('code','unknown')
                      print('Fake-key enrollment probe:',{'status':enrollmentStatus,'stage':stage},flush=True)
                      if enrollBody.get('ok') or enrollmentStatus==200:
                          raise ValueError('Fake-key enrollment must never succeed')
                      if not stage.startswith('ARENA_NET_'):
                          raise ValueError('Private enrollment failed outside ArenaNet validation: '+stage)
                      print('Private monitor health, DB/AES, public GW2 and real cross-origin account enrollment route verified')
                      break
                  raise ValueError('Unexpected monitor health response')
              except Exception as exc:
                  print('Health attempt',attempt+1,'failed:',type(exc).__name__,str(exc)[:220],flush=True)
                  if attempt==0 and hasattr(exc,'read'):
                      response=exc.read(1000).decode('utf-8','replace')
                      print('Public /health rejection body:',response[:600],flush=True)
                      print('HTTP challenge:',getattr(exc,'headers',{}).get('cf-ray','not set'),flush=True)
                  if attempt==7: raise SystemExit('Monitor deployment health verification failed; see reported endpoint error')
                  time.sleep(6)
          PY
