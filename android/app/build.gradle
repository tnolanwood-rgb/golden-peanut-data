plugins { id 'com.android.application' }

android {
    namespace 'com.goldenhub.dual'
    compileSdk 35

    defaultConfig {
        applicationId 'com.goldenhub.dual.preview'
        minSdk 26
        // Private preview: target 34 until Android 15 edge-to-edge insets receive device testing.
        targetSdk 34
        versionCode 1
        versionName '0.2-preview'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            buildConfigField 'String', 'HUB_URL', '"https://private-dual-hub-preview.thegoldenpeanut.pages.dev/"'
        }
        release {
            buildConfigField 'String', 'HUB_URL', '"https://thegoldenpeanut.pages.dev/"'
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
