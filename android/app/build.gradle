plugins { id 'com.android.application' }

android {
    namespace 'com.goldenhub.dual'
    compileSdk 35

    defaultConfig {
        applicationId 'com.goldenhub.dual.preview'
        minSdk 26
        // Private preview: target 34 until Android 15 edge-to-edge insets receive device testing.
        targetSdk 34
        versionCode 3
        versionName '0.4-audit-qa'
    }
    buildFeatures { buildConfig true }
    sourceSets { main.assets.srcDir layout.buildDirectory.dir('generated/hubAssets') }
    signingConfigs {
        debug {
            def key = System.getenv('GOLDEN_HUB_DEBUG_KEYSTORE')
            if (key) {
                storeFile file(key)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'HUB_URL', '"https://private-dual-hub-preview.thegoldenpeanut.pages.dev/"'
        }
        release {
            buildConfigField 'String', 'HUB_URL', '"https://thegoldenpeanut.pages.dev/"'
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }

// Ship the exact reviewed frontend with the APK, at the unchanged HTTPS origin.
// Public live data and authenticated requests still use their existing endpoints.
def bundleHub = tasks.register('bundleHub', Sync) {
    from rootProject.file('../app')
    into layout.buildDirectory.dir('generated/hubAssets/hub')
    exclude '_headers'
}
tasks.named('preBuild').configure { dependsOn bundleHub }
